services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ordengo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      POSTGRES_DB: ordengo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordengo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ordengo:${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}@db:5432/ordengo
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET de al menos 32 caracteres en el archivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}
      MONITOR_EMAIL: ${MONITOR_EMAIL:-monitor.oficina@empresa.com}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-}
      DEFAULT_RATE: ${DEFAULT_RATE:-50}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:
