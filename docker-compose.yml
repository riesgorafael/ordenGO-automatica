services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ordengo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ordengo}
      POSTGRES_DB: ordengo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordengo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ordengo:${DB_PASSWORD:-ordengo}@db:5432/ordengo
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-ordengo123}
      MONITOR_EMAIL: ${MONITOR_EMAIL:-monitor.oficina@empresa.com}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-ordengo123}
      DEFAULT_RATE: ${DEFAULT_RATE:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:
