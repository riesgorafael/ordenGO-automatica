name: Calidad y seguridad

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # corepack va ANTES de setup-node: con `cache: pnpm`, setup-node ejecuta pnpm para ubicar el
      # store y cachearlo. Si corepack se habilita después, ese paso falla con
      # "Unable to locate executable file: pnpm".
      # La versión se fija igual que en el Dockerfile para que CI y la imagen resuelvan idéntico.
      - name: Habilitar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            server/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: Instalar backend
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Probar reglas de negocio
        working-directory: server
        run: pnpm test
      - name: Auditar backend
        working-directory: server
        run: pnpm audit --prod
      - name: Instalar frontend
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Compilar frontend
        working-directory: web
        run: pnpm build
      - name: Auditar frontend
        working-directory: web
        run: pnpm audit --prod
